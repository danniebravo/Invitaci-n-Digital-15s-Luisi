    <rect x="24" y="24" width="252" height="352" stroke-width=".4"/>
    <rect x="27" y="27" width="246" height="346" stroke-width="1"/>
    <rect x="33" y="33" width="234" height="334" rx="2" stroke-width=".9"/>
    <rect x="36" y="36" width="228" height="328" rx="1" stroke-width=".4"/>
