<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}svg.s{width:1200px;height:1200px;display:block}</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="cera" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9"/>
    </filter>
    <radialGradient id="gCera" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#f3cdd8"/><stop offset=".5" stop-color="#e2a3b6"/><stop offset="1" stop-color="#c47c93"/>
    </radialGradient>
    <radialGradient id="gCentro" cx="42%" cy="36%" r="75%">
      <stop offset="0" stop-color="#f6d6df"/><stop offset=".6" stop-color="#e8b2c3"/><stop offset="1" stop-color="#d28fa5"/>
    </radialGradient>
    <linearGradient id="gAnillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe3ea"/><stop offset=".5" stop-color="#d9a0b3"/><stop offset="1" stop-color="#b8708a"/>
    </linearGradient>
  </defs>
</svg>
<div id="o"></div>
<script>
const SELLO = `<svg viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="92" fill="#000" opacity=".18" filter="url(#cera)" transform="translate(2.5 3.5)"/>
  <circle cx="100" cy="100" r="92" fill="url(#gCera)" filter="url(#cera)"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.4" transform="translate(-1 -1)"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#a65f78" stroke-opacity=".55" stroke-width="2.4" transform="translate(1 1)"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gAnillo)" stroke-width="3"/>
  <circle cx="100" cy="100" r="70" fill="url(#gCentro)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.6" transform="translate(-.8 -.8)"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#a65f78" stroke-opacity=".5" stroke-width="1.6" transform="translate(.8 .8)"/>
  <g font-family="'Great Vibes','Parisienne',cursive" font-size="124" text-anchor="middle">
    <text x="97" y="136" fill="#a65f78" fill-opacity=".7">L</text>
    <text x="100.8" y="139" fill="#fff" fill-opacity=".65">L</text>
    <text x="99" y="137.5" fill="#dca1b4">L</text>
  </g>
</svg>`;
document.getElementById("o").innerHTML=SELLO.replace("<svg ",'<svg class="s" ');
document.fonts.ready.then(()=>{ if(location.hash==="#c"){
  const g=document.querySelector("g[font-family]"),b=g.getBBox();
  g.setAttribute("transform","translate(100 100) scale(.88) translate("+(-(b.x+b.width/2))+" "+(-(b.y+b.height/2))+")");}});
</script></body></html>
